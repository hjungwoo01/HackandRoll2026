[[services]]
name = "lightweight-validation-service"
root = "./lightweight-validation/" # Points to the subdirectory
buildCommand = "pip install -r requirements.txt" # Or poetry/npm install
startCommand = "uvicorn app:app --host 0.0.0.0 --port $PORT" # Use $PORT
[services.env]
PORT = "8001" # Unique port for app1

[[services]]
name = "analytics"
root = "./analytics/" # Points to the subdirectory
buildCommand = "pip install -r requirements.txt"
startCommand = "uvicorn app:app --host 0.0.0.0 --port $PORT"
[services.env]
PORT = "8002" # Unique port for app2
